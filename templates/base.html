<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Foodie{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('auth.home') }}" class="logo">
            Foodie<span>.</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('auth.home') }}">Home</a>
            <a href="{{ url_for('auth.cart') }}">Cart</a>
            <a href="{{ url_for('auth.my_orders') }}">My Orders</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
